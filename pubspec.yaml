name: reflectmed_ai
description: "AI-Powered Clinical Reflection & Gibbs Portfolio Generator for Medical Students"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  google_generative_ai: ^0.4.0
  pdf: ^3.10.8
  printing: ^5.12.0
  shared_preferences: ^2.2.2
  flutter_markdown: ^0.6.18+4
  intl: ^0.19.0
  cupertino_icons: ^1.0.6
  flutter_tts: ^4.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/
    - logoo.png
